    <script>
      (function() {
        try {
          var p = window.location.pathname.toLowerCase();
          var isDark = p === '/' || p === '' || p.startsWith('/services');
          var bg = isDark ? '#08050E' : '#F5EEF8';
          document.documentElement.style.backgroundColor = bg;
        } catch (e) {}
      })();
    </script>
